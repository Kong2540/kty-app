<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KTY App">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.gstatic.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com; base-uri 'none'; form-action 'none'">
<title>KTY App · KTY 1994</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="config.js"></script>
<style>
/* ===== ธีม B "Emerald Noir" (ค่าเริ่มต้น) ===== */
:root{
  --bg:#0B110E;--bg2:#0F1A15;--card:rgba(255,255,255,.035);--card-solid:#121B17;--card-b:rgba(201,169,110,.22);--shadow:0 10px 30px rgba(0,0,0,.35);
  --tx:#EEF2EE;--tx2:#CBD5CF;--mu:#A3B1A9;--m2:#7E8C84;--line:rgba(201,169,110,.16);--inp:#111A15;--inp-b:rgba(255,255,255,.14);--soft:rgba(255,255,255,.05);
  --hd:linear-gradient(160deg,#08100C 0%,#10241A 100%);--on-dk:#F2EBDD;--dk-mu:#B6A98E;--metal:#C9A96E;
  --ac:#5FC596;--acbtn:linear-gradient(135deg,#3FA676,#2C7F59);--acbtn-tx:#07100B;--gold:#C9A96E;--chip-on:#C9A96E;--chip-on-tx:#0B110E;
  --nav:#0E1612;--img:linear-gradient(145deg,#16241D,#0F1914);--img-ink:#C9A96E;--cartbar:linear-gradient(135deg,#C9A96E,#A8854A);--cartbar-tx:#0B110E;--cartbar-btn:#0B110E;--cartbar-btn-tx:#C9A96E;
  --ok-bg:rgba(63,166,118,.16);--ok:#8FD9B4;--warn-bg:rgba(232,196,122,.14);--warn:#E8C47A;--info-bg:rgba(120,160,240,.16);--info:#A9C3FF;--bad-bg:rgba(230,110,95,.16);--bad:#F29A8C;--gray-bg:rgba(255,255,255,.07);--gray:#C9D2CD;
  --lk:#8FD9B4;--focus:#C9A96E;--dk:#0B110E;--ln:var(--inp-b);--pn:var(--card-solid);
  --display:'Bai Jamjuree','IBM Plex Sans Thai',Tahoma,sans-serif;--body:'IBM Plex Sans Thai',Tahoma,system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
/* ===== ธีม A "Ivory Emerald" ===== */
html[data-theme="A"]{
  --bg:#F6F5F0;--bg2:#F6F5F0;--card:#FFFFFF;--card-solid:#FFFFFF;--card-b:#E8E6DD;--shadow:0 1px 2px rgba(20,26,23,.04),0 8px 24px rgba(20,26,23,.06);
  --tx:#14201A;--tx2:#36403B;--mu:#5F6B64;--m2:#6F7A73;--line:#E8E6DD;--inp:#FFFFFF;--inp-b:#D9D6CB;--soft:#EFEDE6;
  --hd:linear-gradient(160deg,#0B110E 0%,#14231B 100%);--on-dk:#F4F6F3;--dk-mu:#A9B8AF;--metal:#B9C4BE;
  --ac:#1F7A55;--acbtn:#1F7A55;--acbtn-tx:#FFFFFF;--gold:#1F7A55;--chip-on:#14201A;--chip-on-tx:#F6F5F0;
  --nav:#FFFFFF;--img:linear-gradient(145deg,#EEF1EC,#E2E8E3);--img-ink:#7E8C84;--cartbar:#0E1311;--cartbar-tx:#F4F6F3;--cartbar-btn:#4FA67E;--cartbar-btn-tx:#0E1311;
  --ok-bg:#DDF1E4;--ok:#1D6B3A;--warn-bg:#FCEFD0;--warn:#7A5200;--info-bg:#DCE8FB;--info:#1E4B9A;--bad-bg:#FBE1DE;--bad:#9B2C20;--gray-bg:#E7E9E4;--gray:#36403B;
  --lk:#1F7A55;--focus:#1F7A55;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px}
body{display:flex;justify-content:center;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;position:relative}
#app>*{flex-shrink:0} /* กันแถบที่เลื่อนแนวนอนได้ (หมวดหมู่) ถูกบีบจนหาย */
@media (min-width:560px){#app{box-shadow:0 0 0 1px var(--line)}}
a{color:var(--lk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.disp{font-family:var(--display)}
/* top bar */
.top{background:var(--hd);color:var(--on-dk);padding:calc(14px + var(--sat)) 12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.top .t{flex:1;min-width:0}.top .t b{display:block;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{color:var(--dk-mu);font-size:12px}
.iconbtn{width:44px;height:44px;border:none;background:transparent;border-radius:22px;display:flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0;position:relative}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--on-dk)}
.brand i{width:1px;height:14px;background:var(--metal);opacity:.7}.brand span.y{font-weight:500;font-size:11px;letter-spacing:.28em;color:var(--metal)}
.tag{font-family:var(--display);font-weight:700;font-size:10px;background:var(--metal);color:#0B110E;padding:2px 5px;border-radius:3px}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--chip-on-tx);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
html[data-theme="A"] .badge{color:#fff}
.steps{background:var(--hd);padding:0 16px 14px;display:grid;gap:6px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--dk-mu);opacity:.75}
.steps i{height:3px;border-radius:2px;background:rgba(255,255,255,.14)}
.steps .done{color:var(--metal);opacity:1}.steps .done i{background:var(--metal)}
.steps .cur{color:var(--on-dk);font-weight:600;opacity:1}.steps .cur i{background:var(--on-dk)}
/* layout */
main{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.foot{position:sticky;bottom:0;background:var(--nav);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--sab));display:flex;gap:10px;z-index:15;backdrop-filter:blur(10px)}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.muted{color:var(--m2);font-size:13px}.small{font-size:12px}
h2{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.01em;margin:4px 0 0}
/* form */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--tx2)}
.inp{height:48px;border:1px solid var(--inp-b);border-radius:13px;background:var(--inp);display:flex;align-items:center;padding:0 12px;gap:8px}
.inp:focus-within{border-color:var(--focus)}
.inp.err{border-color:var(--bad)}.inp.ok{border-color:var(--ac)}
.inp input,.inp select{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:16px;height:100%;color:var(--tx)}
.inp select{appearance:none;-webkit-appearance:none}.inp select option{color:#14201A}
.inp input::placeholder,.ta::placeholder{color:var(--m2)}
textarea.ta{border:1px solid var(--inp-b);border-radius:13px;background:var(--inp);padding:10px 12px;font-size:16px;min-height:72px;resize:vertical;width:100%;color:var(--tx)}
.hint{font-size:12px;color:var(--m2);display:flex;gap:4px;align-items:center}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.mono{font-family:var(--display);font-weight:600;letter-spacing:.04em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--card-b);background:var(--card);font-size:14px;color:var(--tx)}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-tx);font-weight:600}
.seg{display:grid;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{height:38px;border:none;border-radius:10px;background:transparent;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--chip-on);font-weight:600;color:var(--chip-on-tx)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--tx2)}
.check input{width:22px;height:22px;accent-color:var(--ac);flex-shrink:0;margin:2px 0 0}
/* buttons */
.btn{height:52px;border-radius:15px;border:none;background:var(--acbtn);color:var(--acbtn-tx);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98);filter:brightness(1.05)}
.btn.full{flex:1}.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--card-b)}
.btn.dark{background:var(--tx);color:var(--bg)}.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;padding:0 14px}
.link{border:none;background:none;color:var(--lk);text-decoration:underline;padding:4px;font-size:14px}
/* cards */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);color:var(--tx)}
.card.hl{border-color:var(--gold)}
a.card,button.card{text-decoration:none;color:inherit;font:inherit;text-align:left}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.kv span:first-child{color:var(--m2)}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.st-PENDING,.st-BORROWED,.st-WARN,.st-DIFF_REVIEW{background:var(--warn-bg);color:var(--warn)}
.st-APPROVED{background:var(--info-bg);color:var(--info)}
.st-PARTIAL,.st-DRAFT,.st-CANCELLED,.st-NO_BOQ{background:var(--gray-bg);color:var(--gray)}
.st-CLOSED,.st-OK,.st-ACTIVE{background:var(--ok-bg);color:var(--ok)}
.st-REJECTED,.st-OVER,.st-INACTIVE{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;border:1px solid transparent}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.info{background:var(--info-bg);color:var(--info)}
/* bars */
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pw-meter i{height:4px;border-radius:2px;background:var(--soft)}.pw-meter i.on{background:var(--ac)}
/* avatar */
.av{border-radius:50%;background:var(--metal);color:#0B110E;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;flex-shrink:0;overflow:hidden}
html[data-theme="A"] .av{background:#1F7A55;color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.av.ghost{background:var(--soft);align-items:flex-end;color:var(--m2)}
/* otp */
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{height:58px;border-radius:13px;border:1px solid var(--inp-b);background:var(--inp);color:var(--tx);text-align:center;font-family:var(--display);font-weight:700;font-size:26px;width:100%;outline:none}
.otp input:focus{border:2px solid var(--focus)}
/* lists */
.line{display:flex;gap:10px;align-items:center;justify-content:space-between}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:11px;border:1px solid var(--card-b);background:var(--card);color:var(--tx);font-size:18px}
.qty button.p{background:var(--acbtn);color:var(--acbtn-tx);border:none}
.qty input{width:62px;height:36px;border:1px solid var(--inp-b);border-radius:11px;background:var(--inp);color:var(--tx);text-align:center;font-family:var(--display);font-weight:700;font-size:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity}
.hscroll>*{scroll-snap-align:start;flex-shrink:0}
/* nav */
nav.bn{position:sticky;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 6px calc(6px + var(--sab));z-index:15;backdrop-filter:blur(10px)}
nav.bn a,nav.bn button{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--m2);padding:6px 0;position:relative;border:none;background:none}
nav.bn a.on{color:var(--ac);font-weight:600}
nav.bn .fab{justify-self:center;width:56px;height:56px;border-radius:28px;background:var(--acbtn);margin-top:-26px;justify-content:center;color:var(--acbtn-tx);box-shadow:0 8px 20px rgba(31,122,85,.35)}
/* signature (พื้นขาวเสมอ ให้หมึกเห็นชัดทั้ง 2 ธีม) */
.sig{position:relative;height:150px;border:1px dashed var(--card-b);border-radius:16px;background:#fff;touch-action:none}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px}
.sig .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9AA59F;font-size:14px;pointer-events:none}
/* overlays */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:var(--card-solid);color:var(--tx);border:1px solid var(--card-b);padding:12px 16px;border-radius:14px;font-size:14px;max-width:min(92vw,480px);z-index:100;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none;cursor:pointer}
#toast.show{display:block;animation:up .25s ease}#toast.bad{border-color:var(--bad);color:var(--bad)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,6,.6);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card-solid);border-top:1px solid var(--card-b);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + var(--sab));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up2 .22s ease}
.modal>*{flex-shrink:0} /* กันรูปตัวอย่าง/รายการถูกบีบจนหายเมื่อหน้าต่างยาว */
@keyframes up2{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.loading{position:fixed;inset:0;background:rgba(5,8,6,.35);z-index:80;display:flex;align-items:center;justify-content:center}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{background-color:#0B110E;background-image:linear-gradient(rgba(201,169,110,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,110,.08) 1px,transparent 1px),var(--hd);background-size:24px 24px,24px 24px,auto;padding:calc(44px + var(--sat)) 28px 28px;display:flex;flex-direction:column;gap:12px;color:var(--on-dk)}
.empty{text-align:center;color:var(--m2);padding:28px 10px;font-size:14px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb th{background:var(--soft);text-align:left;padding:8px;color:var(--mu);font-weight:600}table.tb td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.r{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== KTY App: หน้าแรก / แค็ตตาล็อก ===== */
.hubhd{background:var(--hd);color:var(--on-dk);padding:calc(26px + var(--sat)) 20px 64px}
.sum{margin:-44px 16px 0;position:relative;background:var(--card-solid);border:1px solid var(--card-b);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:16px 6px}
.sum>div+div{border-left:1px solid var(--line)}.sum b{display:block;font-family:var(--display);font-size:26px;font-weight:700;color:var(--tx)}.sum b.g{color:var(--gold)}.sum span{font-size:12px;color:var(--m2)}
.svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{position:relative;min-height:124px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--tx);text-align:left;transition:transform .12s ease}
.svc:active{transform:scale(.98)}.svc.soon{opacity:.6}
.svc .ic{width:44px;height:44px;border-radius:14px;background:var(--ok-bg);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.svc b{font-family:var(--display);font-weight:600;font-size:16px;display:block}.svc small{font-size:12px;color:var(--m2)}
.svc .bd{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--gold);color:var(--chip-on-tx);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
html[data-theme="A"] .svc .bd{color:#fff}
.svc .sn{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.06em;color:var(--m2);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.search{height:46px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--dk-mu)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--on-dk);font-size:15px}
.search input::placeholder{color:var(--dk-mu)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;color:var(--mu);font-size:12px;padding:0}
.cat .ci{width:54px;height:54px;border-radius:18px;background:var(--card);border:1px solid var(--card-b);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.cat.on{color:var(--tx);font-weight:600}.cat.on .ci{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-tx)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border:1px solid var(--card-b);border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mimg{height:110px;border-radius:14px;background:var(--img);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--img-ink)}
.mimg img{width:100%;height:100%;object-fit:cover}
.mimg .sb{position:absolute;left:8px;top:8px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.mname{font-weight:600;font-size:14px;line-height:1.3;padding:8px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mspec{font-size:11px;color:var(--m2);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 0}
.addb{width:36px;height:36px;border-radius:12px;border:none;background:var(--acbtn);color:var(--acbtn-tx);display:flex;align-items:center;justify-content:center}
.step{display:flex;align-items:center;gap:2px;background:var(--acbtn);border-radius:12px;padding:3px}
.step button{width:28px;height:30px;border:none;background:none;color:var(--acbtn-tx);display:flex;align-items:center;justify-content:center}
.step b{font-family:var(--display);color:var(--acbtn-tx);min-width:22px;text-align:center;font-size:15px}
.kit{width:210px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--shadow);text-align:left;color:var(--tx)}
.kit em{font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--gold)}
.fq{width:132px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--card-b);text-align:left;color:var(--tx)}
.fq .mimg{height:72px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 32px));bottom:calc(18px + var(--sab));height:62px;border-radius:19px;background:var(--cartbar);color:var(--cartbar-tx);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;box-shadow:0 14px 30px rgba(0,0,0,.35);z-index:30;border:none;text-align:left;animation:up .25s ease}
.cartbar .go{height:46px;padding:0 16px;border-radius:14px;background:var(--cartbar-btn);color:var(--cartbar-btn-tx);display:flex;align-items:center;font-family:var(--display);font-weight:700;font-size:14px}
.cartbar .cnt{position:absolute;top:-6px;right:-8px;width:19px;height:19px;border-radius:10px;background:var(--cartbar-btn);color:var(--cartbar-btn-tx);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.thumb{width:58px;height:58px;flex-shrink:0;border-radius:13px;background:var(--img);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--img-ink)}
.thumb{position:relative}.thumb img,.mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* แนบรูป */
.pt{position:relative;width:76px;height:76px;flex-shrink:0;border-radius:12px;overflow:hidden;background:var(--img)}
.pt img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.pok,.pup{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.pok{background:#3FA676;color:#08100C}.pup{background:rgba(0,0,0,.55);width:26px;height:26px;border-radius:13px}
.perr{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:12px;border:none;background:var(--bad);color:#fff;font-weight:700}
.pdel{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:11px;border:none;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.padd{width:76px;height:76px;flex-shrink:0;border-radius:12px;border:1.5px dashed var(--gold);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{aspect-ratio:1;border:none;border-radius:10px;overflow:hidden;background:var(--img);color:var(--img-ink);padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.viewer{position:fixed;inset:0;z-index:120;background:rgba(4,7,5,.96);display:flex;flex-direction:column;color:#F2EBDD}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--sat)) 12px 6px 16px;font-size:13px}
.vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}.vimg img.z{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.vnav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px calc(14px + var(--sab))}
/* สลับมุมมอง */
.vt{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--soft);border:1px solid var(--line)}
.vt.dk{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.vt button{width:34px;height:30px;border:none;border-radius:8px;background:none;color:var(--m2);display:flex;align-items:center;justify-content:center;padding:0}
.vt.dk button{color:var(--dk-mu)}
.vt button.on{background:var(--chip-on);color:var(--chip-on-tx)}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
table.mt{width:100%;border-collapse:collapse;font-size:13px}
table.mt th{position:sticky;top:0;background:var(--card-solid);text-align:left;padding:9px 6px;color:var(--mu);font-weight:600;border-bottom:1px solid var(--line);font-size:12px}
table.mt td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.mt td.c{font-family:var(--display);font-weight:600;font-size:11px;white-space:nowrap;color:var(--gold)}
table.mt .step{display:inline-flex}
.sbw .sb{position:static;display:inline-block;margin-top:3px}
.st-DELIVERED{background:var(--info-bg);color:var(--info)}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
